services:
  - type: web
    name: cylindr
    runtime: node
    plan: free
    # This repo has package.json at its root, so Render builds from the root.
    # devDependencies (typescript, tsx) are needed for the build, so force a
    # full install regardless of NODE_ENV.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      # PORT is provided by Render automatically; index.ts already reads it.
